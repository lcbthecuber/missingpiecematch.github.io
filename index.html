<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missing Piece Match</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    /* BIG on desktop, smaller on phones */
    .logo {
      width: clamp(230px, 38vw, 500px);
      height: auto;
      margin-bottom: 30px;
    }

    /* Responsive text */
    .hero h1 {
      font-size: clamp(20px, 3.5vw, 42px);
      line-height: 1.4;
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .copyright {
      margin-top: 20px;
      font-size: clamp(12px, 1.5vw, 18px);
      color: #777;
    }

    /* Extra mobile tuning */
    @media (max-width: 480px) {
      .hero {
        padding: 20px 12px;
      }

      .hero h1 {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<section class="hero">
  <img src="logo.png" alt="Missing Piece Match Logo" class="logo">

  <h1>
    missingpiecematch@gmail.com
  </h1>

  <div class="copyright">
    © 2026 Missing Piece Match
  </div>
</section>

</body>
</html>
